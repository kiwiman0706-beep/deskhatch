name: release

# Tag a version (e.g. v0.1.1) to build the Windows + macOS artifacts on GitHub's
# hosted runners, publish a single GitHub Release with all of them, and
# auto-submit/update the winget manifest.
on:
  push:
    tags:
      - 'v*'
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Install dependencies
        run: npm install
      - name: Build installer + portable
        run: npm run dist -- --publish never
      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/DeskHatch-Setup-*.exe
            dist/DeskHatch-Portable-*.exe
            dist/latest.yml
            dist/*.blockmap
          generate_release_notes: true

  build-mac:
    # GitHub's hosted macOS runner (a real Mac VM in the cloud) — no Mac of your
    # own needed. Builds a universal (Intel + Apple Silicon) dmg + zip.
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Install dependencies
        run: npm install
      - name: Build dmg + zip (universal, unsigned)
        run: npm run dist:mac -- --universal --publish never
        env:
          # No paid Apple Developer cert: build unsigned instead of failing while
          # hunting for a signing identity. Users open via right-click -> Open.
          CSC_IDENTITY_AUTO_DISCOVERY: false
      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/*.dmg
            dist/*.zip
          generate_release_notes: true

  # Submits a PR to microsoft/winget-pkgs. NOTE: the FIRST version must be
  # submitted once manually with wingetcreate (see docs/PUBLISHING.md); after
  # the package exists, this keeps it updated automatically on every release.
  winget:
    needs: build-windows
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    steps:
      - name: Submit / update winget manifest
        continue-on-error: true
        uses: vedantmgoyal9/winget-releaser@v2
        with:
          identifier: Theta.Deskhatch
          installers-regex: 'Setup-.*\.exe$'
          release-tag: ${{ github.ref_name }}
          fork-user: kiwiman0706-beep
          token: ${{ secrets.WINGET_TOKEN }}
