name: release

# Two ways to cut a release:
#   1. Push a tag like v0.1.1  (normal flow once tag pushes are allowed), or
#   2. Run this workflow manually (Actions tab / API) with a `version` input —
#      action-gh-release then CREATES that tag at the current commit.
# Either way: build Windows + macOS artifacts on GitHub's hosted runners,
# publish one GitHub Release, and submit/update the winget manifest.
on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Tag to create & release (e.g. v0.1.0)'
        required: true
        default: v0.1.0

permissions:
  contents: write

env:
  # On a tag push this is empty -> falls back to the tag (github.ref_name).
  RELEASE_TAG: ${{ github.event.inputs.version || github.ref_name }}

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Install dependencies
        run: npm install
      - name: Build installer + portable
        run: npm run dist -- --publish never
      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.RELEASE_TAG }}
          # A tag with a '-' (e.g. v0.1.65-beta.1) is a prerelease: electron-updater
          # ignores it for stable users; only beta-channel opt-ins receive it.
          prerelease: ${{ contains(env.RELEASE_TAG, '-') }}
          files: |
            dist/DeskHatch-Setup-*.exe
            dist/DeskHatch-Portable-*.exe
            dist/*.yml
            dist/*.blockmap
          generate_release_notes: true

  build-windows-arm64:
    # Secondary native Windows ARM64 build. Isolated + non-blocking
    # (continue-on-error) so a failure here never affects the x64 / macOS
    # release. Only the installers are attached — NOT the update *.yml — so the
    # x64 auto-update channel is left untouched. Camera/ffmpeg uses the bundled
    # x64 binary via Windows-on-ARM x64 emulation.
    needs: build-windows
    continue-on-error: true
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Install dependencies
        run: npm install
      - name: Build ARM64 installer + portable
        run: npm run dist -- --arm64 --publish never
      - name: Add ARM64 artifacts to the release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.RELEASE_TAG }}
          prerelease: ${{ contains(env.RELEASE_TAG, '-') }}
          files: |
            dist/DeskHatch-Setup-*-arm64.exe
            dist/DeskHatch-Portable-*-arm64.exe

  build-mac:
    # GitHub's hosted macOS runner (a real Mac VM in the cloud) — no Mac of your
    # own needed. Builds a universal (Intel + Apple Silicon) dmg + zip.
    # Runs after Windows so the release/tag already exists (avoids a create race).
    needs: build-windows
    runs-on: macos-latest
    env:
      # Whether this repo has the Apple Developer ID secrets, as "true"/"false".
      # Resolved here so the two build steps can be gated WITHOUT putting the
      # signing variables in the environment of the unsigned one: electron-builder
      # treats an empty CSC_LINK as a certificate path that was deliberately left
      # blank, resolves it against the working directory and dies with
      # "<repo dir> not a file" — which is exactly how the v0.1.72-beta.1 macOS
      # build failed. An absent variable is not the same as an empty one.
      SIGNED: ${{ secrets.MAC_CSC_LINK != '' && secrets.APPLE_TEAM_ID != '' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Install dependencies
        run: npm install

      # With an Apple Developer ID in the repo secrets: sign with the hardened
      # runtime (entitlements in build/entitlements.mac*.plist) and notarize, so
      # Gatekeeper trusts the stapled ticket and never sends the binary through
      # XProtect's on-launch scan.
      # Secrets: MAC_CSC_LINK (base64 .p12), MAC_CSC_KEY_PASSWORD, APPLE_ID,
      # APPLE_APP_SPECIFIC_PASSWORD, APPLE_TEAM_ID. See docs/PUBLISHING.md.
      - name: Build dmg + zip (universal, signed + notarized)
        if: env.SIGNED == 'true'
        env:
          CSC_LINK: ${{ secrets.MAC_CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.MAC_CSC_KEY_PASSWORD }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        # -c.mac.notarize.teamId is what selects notarytool; without a teamId
        # electron-builder falls back to the retired altool path.
        run: npm run dist:mac -- --universal --publish never -c.mac.notarize.teamId="$APPLE_TEAM_ID"

      # Without them: an unsigned build that the afterPack hook
      # (scripts/mac-adhoc-sign.js) ad-hoc signs. Users install it with
      # scripts/install-mac.sh, or un-quarantine by hand -- docs/MACOS-INSTALL.md.
      - name: Build dmg + zip (universal, unsigned)
        if: env.SIGNED != 'true'
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: false
        run: |
          echo "::warning title=macOS build is unsigned::No Apple Developer ID secrets. Install with scripts/install-mac.sh — see docs/MACOS-INSTALL.md."
          npm run dist:mac -- --universal --publish never

      # Prints what actually shipped, so a release never again quietly goes out
      # unsigned without anyone noticing. Informational only.
      - name: Report signing status
        if: always()
        run: |
          APP=dist/mac-universal/DeskHatch.app
          [ -d "$APP" ] || APP=dist/mac/DeskHatch.app
          [ -d "$APP" ] || { echo "no .app found"; exit 0; }
          codesign -dv --verbose=4 "$APP" 2>&1 | head -20 || true
          echo '--- Gatekeeper verdict ---'
          spctl -a -vvv -t install "$APP" 2>&1 || true
          echo '--- notarization ticket ---'
          xcrun stapler validate "$APP" 2>&1 || true
      - name: Add macOS artifacts to the release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.RELEASE_TAG }}
          prerelease: ${{ contains(env.RELEASE_TAG, '-') }}
          files: |
            dist/*.dmg
            dist/*.zip
          generate_release_notes: true

  # Submits a PR to microsoft/winget-pkgs. NOTE: the FIRST version must be
  # submitted once manually with wingetcreate (see docs/PUBLISHING.md); after
  # the package exists, this keeps it updated automatically on every release.
  winget:
    needs: build-windows
    # Don't push beta/prerelease tags to winget — stable releases only.
    if: ${{ !contains(github.event.inputs.version || github.ref_name, '-') }}
    runs-on: ubuntu-latest
    steps:
      - name: Submit / update winget manifest
        continue-on-error: true
        uses: vedantmgoyal9/winget-releaser@v2
        with:
          identifier: Theta.DeskHatch
          installers-regex: 'Setup-.*\.exe$'
          release-tag: ${{ env.RELEASE_TAG }}
          fork-user: kiwiman0706-beep
          token: ${{ secrets.WINGET_TOKEN }}
