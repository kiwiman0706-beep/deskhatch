name: msix

# Build the Microsoft Store package (MSIX/APPX) on demand. Run this manually
# (Actions tab → "msix" → Run workflow) when you want a package to upload to
# Partner Center. The build is UNSIGNED — the Store signs it on submission.
# Identity (PackageName / Publisher / PublisherDisplayName) comes from the appx
# block in package.json and must match the Partner Center reservation.
#
# Note: build from a STABLE version (no -beta in package.json), because MSIX
# versions must be numeric (x.y.z.0).
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-msix:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Install dependencies
        run: npm install
      - name: Generate Store tile assets (build/appx)
        run: npm run gen:appx
      - name: Build MSIX (appx) for the Store
        run: npm run dist:msix -- --x64 --publish never
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: false
      - name: Upload MSIX artifact
        uses: actions/upload-artifact@v4
        with:
          name: DeskHatch-MSIX
          path: dist/*.appx
          if-no-files-found: error
