<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" role="img" aria-label="DeskHatch: top-edge bar; open web apps in drawers, and drag files, URLs or text into the Clip">
  <defs>
    <linearGradient id="pg" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#f7fbfb"/><stop offset="1" stop-color="#e3eeee"/></linearGradient>
    <linearGradient id="bar" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#2e8b8b"/><stop offset="1" stop-color="#1f6f6f"/></linearGradient>
    <linearGradient id="hd" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#2e8b8b"/><stop offset="1" stop-color="#236f6f"/></linearGradient>
    <filter id="ds" x="-30%" y="-30%" width="160%" height="160%"><feDropShadow dx="0" dy="7" stdDeviation="9" flood-color="#0b2a29" flood-opacity="0.28"/></filter>
    <clipPath id="screen"><rect x="40" y="40" width="880" height="460" rx="16"/></clipPath>
    <clipPath id="underbar"><rect x="40" y="74" width="880" height="426"/></clipPath>
  </defs>

  <rect width="960" height="540" fill="#eef4f4"/>
  <rect x="40" y="40" width="880" height="460" rx="16" fill="url(#pg)" stroke="#c3ced3" stroke-width="2"/>

  <g clip-path="url(#screen)" font-family="Segoe UI, Helvetica, sans-serif">
    <circle cx="810" cy="440" r="150" fill="#d3e3e3" opacity="0.5"/>
    <rect x="70" y="92" width="820" height="392" rx="10" fill="#ffffff" opacity="0.62"/>
    <rect x="70" y="92" width="820" height="26" rx="10" fill="#ccdcdc" opacity="0.7"/>

    <rect x="40" y="40" width="880" height="34" fill="url(#bar)"/>
    <rect x="50" y="48" width="20" height="20" rx="4" fill="#185c5c"/>
    <text x="53" y="63" fill="#eafafa" font-size="13">☰</text>
    <rect x="78" y="44" width="70" height="26" rx="4" fill="#fff" opacity="0"><animate attributeName="opacity" values="0;0;.18;.18;0;0;0" keyTimes="0;.12;.18;.40;.44;.9;1" dur="9s" repeatCount="indefinite"/></rect>
    <rect x="812" y="44" width="34" height="26" rx="4" fill="#fff" opacity="0"><animate attributeName="opacity" values="0;0;.18;.18;0;0" keyTimes="0;.50;.56;.94;.97;1" dur="9s" repeatCount="indefinite"/></rect>
    <g fill="#eafafa" font-size="13" font-weight="600">
      <text x="86"  y="61">✉ Mail</text>
      <text x="158" y="61">📅 Cal</text>
      <text x="224" y="61">🗂 Drive</text>
      <text x="306" y="61">✨ Gemini</text>
      <text x="820" y="61">📎</text>
      <text x="884" y="61">▲</text>
    </g>

    <g clip-path="url(#underbar)"><g filter="url(#ds)">
      <animateTransform attributeName="transform" type="translate" values="0,-240; 0,-240; 0,0; 0,0; 0,-240; 0,-240" keyTimes="0;.12;.18;.40;.44;1" dur="9s" repeatCount="indefinite"/>
      <rect x="78" y="74" width="306" height="210" rx="10" fill="#fff" stroke="#1f6f6f" stroke-width="2"/>
      <rect x="78" y="74" width="306" height="26" rx="10" fill="url(#hd)"/><rect x="78" y="90" width="306" height="10" fill="url(#hd)"/>
      <text x="90" y="91" fill="#eafafa" font-size="12" font-weight="700">✉ Mail</text>
      <text x="350" y="91" fill="#bfe3e3" font-size="11">📌</text><text x="368" y="91" fill="#bfe3e3" font-size="11">✕</text>
      <g>
        <g transform="translate(0,0)"><circle cx="100" cy="124" r="11" fill="#5aa0c0"/><text x="95" y="128" fill="#fff" font-size="11" font-weight="700">A</text><rect x="120" y="116" width="120" height="8" rx="4" fill="#46606a"/><rect x="120" y="130" width="230" height="7" rx="3.5" fill="#cfdada"/><circle cx="368" cy="122" r="4" fill="#1f9d6b"/></g>
        <g transform="translate(0,38)"><circle cx="100" cy="124" r="11" fill="#c98b5a"/><text x="95" y="128" fill="#fff" font-size="11" font-weight="700">K</text><rect x="120" y="116" width="96" height="8" rx="4" fill="#46606a"/><rect x="120" y="130" width="208" height="7" rx="3.5" fill="#cfdada"/><circle cx="368" cy="122" r="4" fill="#1f9d6b"/></g>
        <g transform="translate(0,76)"><circle cx="100" cy="124" r="11" fill="#8a7fc0"/><text x="95" y="128" fill="#fff" font-size="11" font-weight="700">M</text><rect x="120" y="116" width="140" height="8" rx="4" fill="#7c909a"/><rect x="120" y="130" width="176" height="7" rx="3.5" fill="#dde6e6"/></g>
        <g transform="translate(0,114)"><circle cx="100" cy="124" r="11" fill="#5ab0a0"/><text x="95" y="128" fill="#fff" font-size="11" font-weight="700">S</text><rect x="120" y="116" width="110" height="8" rx="4" fill="#7c909a"/><rect x="120" y="130" width="220" height="7" rx="3.5" fill="#dde6e6"/></g>
      </g>
    </g></g>

    <g clip-path="url(#underbar)"><g filter="url(#ds)">
      <animateTransform attributeName="transform" type="translate" values="0,-260; 0,-260; 0,0; 0,0; 0,-260; 0,-260" keyTimes="0;.50;.56;.94;.97;1" dur="9s" repeatCount="indefinite"/>
      <rect x="592" y="74" width="300" height="236" rx="10" fill="#fff" stroke="#1f6f6f" stroke-width="2"/>
      <rect x="592" y="74" width="300" height="26" rx="10" fill="url(#hd)"/><rect x="592" y="90" width="300" height="10" fill="url(#hd)"/>
      <text x="604" y="91" fill="#eafafa" font-size="12" font-weight="700">📎 Clip</text>
      <text x="876" y="91" fill="#bfe3e3" font-size="11">✕</text>
      <rect x="604" y="108" width="64" height="20" rx="5" fill="#eaf3f3" stroke="#cfdede"/><text x="612" y="122" fill="#1f6f6f" font-size="11" font-weight="700">＋ File</text>
      <rect x="676" y="108" width="80" height="20" rx="5" fill="#eaf3f3" stroke="#cfdede"/><text x="684" y="122" fill="#1f6f6f" font-size="11" font-weight="700">＋ Folder</text>
      <g font-size="12" fill="#33484a">
        <g transform="translate(0,0)"><text x="608" y="153" font-size="14">📄</text><text x="630" y="153">report.pdf</text></g>
        <g transform="translate(0,26)"><text x="608" y="153" font-size="14">🔗</text><text x="630" y="153">github.com/…/deskhatch</text></g>
        <g transform="translate(0,52)" opacity="0"><animate attributeName="opacity" values="0;0;1;1;0" keyTimes="0;.74;.78;.94;1" dur="9s" repeatCount="indefinite"/><text x="608" y="153" font-size="14">🖼</text><text x="630" y="153">photo.png</text></g>
      </g>
      <rect x="604" y="236" width="276" height="60" rx="8" fill="#f1f8f8" stroke="#9cc6c6" stroke-width="1.5" stroke-dasharray="6 5"><animate attributeName="fill" values="#f1f8f8;#f1f8f8;#dcefe9;#dcefe9;#f1f8f8;#f1f8f8" keyTimes="0;.62;.66;.74;.78;1" dur="9s" repeatCount="indefinite"/></rect>
      <text x="742" y="270" fill="#5c8c8c" font-size="12" text-anchor="middle">Drop a file · URL · text</text>
    </g></g>

    <g opacity="0">
      <animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;.58;.60;.73;.76;1" dur="9s" repeatCount="indefinite"/>
      <g>
        <animateTransform attributeName="transform" type="translate" values="150,150; 150,150; 70,40; 0,0; 0,0; 0,0" keyTimes="0;.58;.66;.73;.76;1" dur="9s" repeatCount="indefinite"/>
        <rect x="612" y="206" width="62" height="80" rx="7" fill="#fff" stroke="#9cc6c6" filter="url(#ds)"/>
        <text x="628" y="246" font-size="26">🖼</text>
        <rect x="620" y="262" width="46" height="7" rx="3.5" fill="#cfdada"/>
      </g>
    </g>

    <path d="M0,0 L0,18 L4.8,12.6 L8.3,19.2 L11,18 L7.4,11.2 L13.4,11.2 Z" fill="#15201f" stroke="#fff" stroke-width="1.1">
      <animateTransform attributeName="transform" type="translate"
        values="520,320; 110,58; 110,58; 826,58; 826,58; 770,210; 690,250; 690,250; 520,320"
        keyTimes="0; .10; .40; .50; .58; .66; .73; .90; 1" dur="9s" repeatCount="indefinite"/>
    </path>
  </g>
</svg>
