<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" role="img" aria-label="DeskHatch demo">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#eaf2f2"/><stop offset="1" stop-color="#dbe7e7"/>
    </linearGradient>
    <linearGradient id="bar" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#2e8b8b"/><stop offset="1" stop-color="#1f6f6f"/>
    </linearGradient>
    <filter id="sh" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="6" stdDeviation="10" flood-color="#000" flood-opacity="0.22"/>
    </filter>
    <clipPath id="screen"><rect x="40" y="40" width="880" height="460" rx="16"/></clipPath>
  </defs>

  <rect width="960" height="540" fill="#f4f6f6"/>
  <!-- screen -->
  <rect x="40" y="40" width="880" height="460" rx="16" fill="url(#bg)" stroke="#c3ced3" stroke-width="2"/>
  <g clip-path="url(#screen)">
    <!-- desktop wallpaper hint -->
    <circle cx="760" cy="430" r="120" fill="#cfe0e0" opacity="0.5"/>
    <circle cx="180" cy="120" r="80" fill="#cfe0e0" opacity="0.35"/>

    <!-- top bar -->
    <rect x="40" y="40" width="880" height="34" fill="url(#bar)"/>
    <rect x="50" y="49" width="16" height="16" rx="3" fill="#eafafa"/>
    <g fill="#eafafa" opacity="0.95" font-family="Segoe UI, sans-serif" font-size="13">
      <rect x="78"  y="50" width="62" height="14" rx="7" opacity="0.18"/><text x="86"  y="61">Mail</text>
      <rect x="150" y="50" width="56" height="14" rx="7" opacity="0.30"/><text x="158" y="61">Cal</text>
      <rect x="216" y="50" width="70" height="14" rx="7" opacity="0.18"/><text x="224" y="61">Drive</text>
      <rect x="296" y="50" width="64" height="14" rx="7" opacity="0.18"/><text x="304" y="61">Notes</text>
      <rect x="370" y="50" width="80" height="14" rx="7" opacity="0.18"/><text x="378" y="61">Gemini</text>
    </g>

    <!-- drawer sliding down under "Mail" -->
    <g>
      <animateTransform attributeName="transform" type="translate"
        values="0,-220; 0,-220; 0,0; 0,0; 0,-220"
        keyTimes="0; 0.12; 0.34; 0.86; 1" dur="5.5s" repeatCount="indefinite"/>
      <rect x="78" y="74" width="320" height="216" rx="10" fill="#ffffff" stroke="#1f6f6f" stroke-width="2" filter="url(#sh)"/>
      <rect x="78" y="74" width="320" height="26" rx="10" fill="url(#bar)"/>
      <text x="90" y="91" fill="#eafafa" font-family="Segoe UI, sans-serif" font-size="12" font-weight="700">✉ Mail</text>
      <g fill="#dfeaea">
        <rect x="94"  y="116" width="288" height="12" rx="6"/>
        <rect x="94"  y="138" width="240" height="12" rx="6"/>
        <rect x="94"  y="160" width="270" height="12" rx="6"/>
        <rect x="94"  y="182" width="210" height="12" rx="6"/>
        <rect x="94"  y="204" width="250" height="12" rx="6"/>
        <rect x="94"  y="226" width="180" height="12" rx="6"/>
        <rect x="94"  y="248" width="230" height="12" rx="6"/>
      </g>
    </g>

    <!-- cursor -->
    <path d="M0,0 L0,17 L4.6,12 L8,18.5 L10.6,17.2 L7.1,10.6 L13,10.6 Z" fill="#15201f" stroke="#fff" stroke-width="1">
      <animateTransform attributeName="transform" type="translate"
        values="520,300; 96,58; 96,58; 300,260; 520,300"
        keyTimes="0; 0.12; 0.4; 0.86; 1" dur="5.5s" repeatCount="indefinite"/>
    </path>
  </g>
</svg>
