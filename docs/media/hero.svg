<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" role="img" aria-label="DeskHatch: a top-edge bar; clicking a button slides a drawer out from under it">
  <defs>
    <linearGradient id="pg" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#f7fbfb"/><stop offset="1" stop-color="#e3eeee"/></linearGradient>
    <linearGradient id="bar" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#2e8b8b"/><stop offset="1" stop-color="#1f6f6f"/></linearGradient>
    <linearGradient id="hd" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#2e8b8b"/><stop offset="1" stop-color="#236f6f"/></linearGradient>
    <filter id="ds" x="-30%" y="-30%" width="160%" height="160%"><feDropShadow dx="0" dy="7" stdDeviation="9" flood-color="#0b2a29" flood-opacity="0.28"/></filter>
    <clipPath id="screen"><rect x="40" y="40" width="880" height="460" rx="16"/></clipPath>
    <!-- only paint drawers BELOW the bar, so they appear to slide out from under it -->
    <clipPath id="underbar"><rect x="40" y="74" width="880" height="426"/></clipPath>
  </defs>

  <rect width="960" height="540" fill="#eef4f4"/>
  <rect x="40" y="40" width="880" height="460" rx="16" fill="url(#pg)" stroke="#c3ced3" stroke-width="2"/>

  <g clip-path="url(#screen)">
    <!-- desktop + a faux maximized app window behind, to show the bar overlays apps -->
    <circle cx="800" cy="430" r="150" fill="#d3e3e3" opacity="0.55"/>
    <circle cx="150" cy="150" r="90" fill="#d3e3e3" opacity="0.4"/>
    <rect x="70" y="92" width="820" height="392" rx="10" fill="#ffffff" opacity="0.65"/>
    <rect x="70" y="92" width="820" height="26" rx="10" fill="#ccdcdc" opacity="0.7"/>
    <g fill="#dde8e8"><rect x="86" y="138" width="500" height="10" rx="5"/><rect x="86" y="160" width="380" height="10" rx="5"/></g>

    <!-- ===== TOP BAR ===== -->
    <g>
      <rect x="40" y="40" width="880" height="34" fill="url(#bar)"/>
      <rect x="50" y="49" width="16" height="16" rx="3" fill="#eafafa"/>
      <!-- active highlight behind Mail (brightens while its drawer is open) -->
      <rect x="74" y="44" width="64" height="26" rx="4" fill="#ffffff" opacity="0">
        <animate attributeName="opacity" values="0;0;0.18;0.18;0;0;0;0" keyTimes="0;0.12;0.18;0.46;0.5;0.9;0.95;1" dur="8s" repeatCount="indefinite"/>
      </rect>
      <rect x="156" y="44" width="56" height="26" rx="4" fill="#ffffff" opacity="0">
        <animate attributeName="opacity" values="0;0;0.18;0.18;0;0" keyTimes="0;0.56;0.62;0.9;0.94;1" dur="8s" repeatCount="indefinite"/>
      </rect>
      <g fill="#eafafa" font-family="Segoe UI, Helvetica, sans-serif" font-size="13" font-weight="600">
        <text x="84"  y="61">Mail</text>
        <text x="164" y="61">Cal</text>
        <text x="224" y="61">Drive</text>
        <text x="298" y="61">Notes</text>
        <text x="372" y="61">Gemini</text>
      </g>
      <g fill="#eafafa"><rect x="892" y="50" width="16" height="2.5" rx="1"/><rect x="892" y="55" width="16" height="2.5" rx="1"/><rect x="892" y="60" width="16" height="2.5" rx="1"/></g>
    </g>

    <!-- ===== MAIL DRAWER (slides out from under the bar) ===== -->
    <g clip-path="url(#underbar)">
      <g filter="url(#ds)">
        <animateTransform attributeName="transform" type="translate"
          values="0,-235; 0,-235; 0,0; 0,0; 0,-235; 0,-235"
          keyTimes="0; 0.12; 0.18; 0.46; 0.50; 1" dur="8s" repeatCount="indefinite"/>
        <rect x="74" y="74" width="306" height="214" rx="10" fill="#ffffff" stroke="#1f6f6f" stroke-width="2"/>
        <rect x="74" y="74" width="306" height="26" rx="10" fill="url(#hd)"/>
        <rect x="74" y="90" width="306" height="10" fill="url(#hd)"/>
        <text x="86" y="91" fill="#eafafa" font-family="Segoe UI, sans-serif" font-size="12" font-weight="700">✉ Mail</text>
        <!-- mail rows: avatar + sender + subject + unread dot -->
        <g font-family="Segoe UI, sans-serif">
          <g transform="translate(0,0)">
            <circle cx="96" cy="124" r="11" fill="#5aa0c0"/><text x="91" y="128" fill="#fff" font-size="11" font-weight="700">A</text>
            <rect x="116" y="116" width="120" height="8" rx="4" fill="#46606a"/>
            <rect x="116" y="130" width="232" height="7" rx="3.5" fill="#cfdada"/>
            <circle cx="366" cy="122" r="4" fill="#1f9d6b"/>
          </g>
          <g transform="translate(0,40)">
            <circle cx="96" cy="124" r="11" fill="#c98b5a"/><text x="91" y="128" fill="#fff" font-size="11" font-weight="700">K</text>
            <rect x="116" y="116" width="96" height="8" rx="4" fill="#46606a"/>
            <rect x="116" y="130" width="210" height="7" rx="3.5" fill="#cfdada"/>
            <circle cx="366" cy="122" r="4" fill="#1f9d6b"/>
          </g>
          <g transform="translate(0,80)">
            <circle cx="96" cy="124" r="11" fill="#8a7fc0"/><text x="91" y="128" fill="#fff" font-size="11" font-weight="700">M</text>
            <rect x="116" y="116" width="140" height="8" rx="4" fill="#7c909a"/>
            <rect x="116" y="130" width="180" height="7" rx="3.5" fill="#dde6e6"/>
          </g>
          <g transform="translate(0,120)">
            <circle cx="96" cy="124" r="11" fill="#5ab0a0"/><text x="91" y="128" fill="#fff" font-size="11" font-weight="700">S</text>
            <rect x="116" y="116" width="110" height="8" rx="4" fill="#7c909a"/>
            <rect x="116" y="130" width="226" height="7" rx="3.5" fill="#dde6e6"/>
          </g>
        </g>
      </g>
    </g>

    <!-- ===== CALENDAR DRAWER (under "Cal") ===== -->
    <g clip-path="url(#underbar)">
      <g filter="url(#ds)">
        <animateTransform attributeName="transform" type="translate"
          values="0,-235; 0,-235; 0,0; 0,0; 0,-235; 0,-235"
          keyTimes="0; 0.56; 0.62; 0.90; 0.94; 1" dur="8s" repeatCount="indefinite"/>
        <rect x="156" y="74" width="250" height="196" rx="10" fill="#ffffff" stroke="#1f6f6f" stroke-width="2"/>
        <rect x="156" y="74" width="250" height="26" rx="10" fill="url(#hd)"/>
        <rect x="156" y="90" width="250" height="10" fill="url(#hd)"/>
        <text x="168" y="91" fill="#eafafa" font-family="Segoe UI, sans-serif" font-size="12" font-weight="700">📅 Calendar</text>
        <g fill="#9fb0b0" font-family="Segoe UI, sans-serif" font-size="9">
          <text x="172" y="118">S</text><text x="204" y="118">M</text><text x="236" y="118">T</text><text x="268" y="118">W</text><text x="300" y="118">T</text><text x="332" y="118">F</text><text x="364" y="118">S</text>
        </g>
        <g>
          <!-- 5 weeks x 7 days grid -->
          <g fill="#e8efef">
            <!-- generated rows -->
            <rect x="168" y="128" width="22" height="18" rx="3"/><rect x="200" y="128" width="22" height="18" rx="3"/><rect x="232" y="128" width="22" height="18" rx="3"/><rect x="264" y="128" width="22" height="18" rx="3"/><rect x="296" y="128" width="22" height="18" rx="3"/><rect x="328" y="128" width="22" height="18" rx="3"/><rect x="360" y="128" width="22" height="18" rx="3"/>
            <rect x="168" y="150" width="22" height="18" rx="3"/><rect x="200" y="150" width="22" height="18" rx="3"/><rect x="232" y="150" width="22" height="18" rx="3"/><rect x="264" y="150" width="22" height="18" rx="3"/><rect x="296" y="150" width="22" height="18" rx="3"/><rect x="328" y="150" width="22" height="18" rx="3"/><rect x="360" y="150" width="22" height="18" rx="3"/>
            <rect x="168" y="172" width="22" height="18" rx="3"/><rect x="200" y="172" width="22" height="18" rx="3"/><rect x="232" y="172" width="22" height="18" rx="3"/><rect x="264" y="172" width="22" height="18" rx="3"/><rect x="296" y="172" width="22" height="18" rx="3"/><rect x="328" y="172" width="22" height="18" rx="3"/><rect x="360" y="172" width="22" height="18" rx="3"/>
            <rect x="168" y="194" width="22" height="18" rx="3"/><rect x="200" y="194" width="22" height="18" rx="3"/><rect x="232" y="194" width="22" height="18" rx="3"/><rect x="264" y="194" width="22" height="18" rx="3"/><rect x="296" y="194" width="22" height="18" rx="3"/><rect x="328" y="194" width="22" height="18" rx="3"/><rect x="360" y="194" width="22" height="18" rx="3"/>
            <rect x="168" y="216" width="22" height="18" rx="3"/><rect x="200" y="216" width="22" height="18" rx="3"/><rect x="232" y="216" width="22" height="18" rx="3"/><rect x="264" y="216" width="22" height="18" rx="3"/><rect x="296" y="216" width="22" height="18" rx="3"/><rect x="328" y="216" width="22" height="18" rx="3"/><rect x="360" y="216" width="22" height="18" rx="3"/>
          </g>
          <rect x="264" y="172" width="22" height="18" rx="3" fill="#1f6f6f"/>
        </g>
      </g>
    </g>

    <!-- ===== cursor ===== -->
    <path d="M0,0 L0,18 L4.8,12.6 L8.3,19.2 L11,18 L7.4,11.2 L13.4,11.2 Z" fill="#15201f" stroke="#fff" stroke-width="1.1">
      <animateTransform attributeName="transform" type="translate"
        values="520,300; 100,58; 100,58; 100,58; 180,58; 180,58; 180,58; 520,300"
        keyTimes="0; 0.10; 0.16; 0.50; 0.56; 0.62; 0.90; 1" dur="8s" repeatCount="indefinite"/>
    </path>
  </g>
</svg>
