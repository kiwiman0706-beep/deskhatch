<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta
    http-equiv="Content-Security-Policy"
    content="default-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: http://127.0.0.1:* http://localhost:*; media-src 'self' http://127.0.0.1:* http://localhost:*; frame-src http://127.0.0.1:* http://localhost:*;"
  />
  <title>SmartSuite.next</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <!-- Thin top bar. Buttons are injected from config.js by renderer.js. -->
  <div id="bar" class="ss-bar ss-interactive"></div>

  <!-- 4px hover strip shown when the bar is hidden (auto-hide / temp-hide). -->
  <div id="peek" class="ss-peek ss-interactive"></div>

  <!-- Open drawers are appended to <body> by renderer.js, positioned absolutely
       beneath the button that opened them. -->

  <script src="config.js"></script>
  <script src="lib/layout.js"></script>
  <script src="lib/drawers.js"></script>
  <script src="renderer.js"></script>
</body>
</html>
