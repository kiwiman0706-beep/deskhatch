<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8" />
<title>Capture</title>
<style>
  html, body { margin: 0; height: 100%; overflow: hidden; cursor: crosshair; background: #000; user-select: none; }
  #img { position: absolute; inset: 0; width: 100%; height: 100%; -webkit-user-drag: none; }
  #sel { position: absolute; border: 2px solid #1f9f9f; background: rgba(31,159,159,0.12); display: none; box-shadow: 0 0 0 9999px rgba(0,0,0,0.35); }
  #hint { position: fixed; left: 50%; top: 18px; transform: translateX(-50%); background: rgba(15,36,35,.92); color: #eafafa; padding: 8px 16px; border-radius: 18px; font: 600 14px "Segoe UI","Hiragino Sans",sans-serif; pointer-events: none; }
</style>
</head>
<body>
  <img id="img" alt="" />
  <div id="sel"></div>
  <div id="hint">ドラッグで範囲選択 / Esc で中止</div>
  <script src="shot.js"></script>
</body>
</html>
