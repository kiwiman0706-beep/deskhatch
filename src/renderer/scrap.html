<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8" />
<title>DeskHatch Scrapbook</title>
<style>
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; font-family: "Segoe UI", "Hiragino Sans", "Noto Sans JP", system-ui, sans-serif; color: #23323a; }
  #app { display: flex; height: 100vh; }
  #boxes { width: 200px; min-width: 150px; border-right: 1px solid #e3eded; background: #f4f8f8; display: flex; flex-direction: column; }
  #notes { width: 280px; min-width: 180px; border-right: 1px solid #e3eded; display: flex; flex-direction: column; }
  #content { flex: 1; display: flex; flex-direction: column; min-width: 0; }
  .hd { padding: 8px 10px; font-weight: 700; font-size: 13px; border-bottom: 1px solid #e3eded; background: #eef4f4; display: flex; gap: 6px; align-items: center; }
  .hd .grow { flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .list { flex: 1; overflow: auto; padding: 6px; }
  .row { padding: 7px 9px; border-radius: 6px; cursor: pointer; font-size: 13px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .row:hover { background: #e8f3f3; }
  .row.sel { background: #d7ecec; font-weight: 700; }
  button { border: 1px solid #cfdede; background: #fff; border-radius: 6px; padding: 5px 9px; font-size: 12px; cursor: pointer; color: #1f6f6f; }
  button:hover { background: #eef6f6; }
  input.new { flex: 1; min-width: 0; border: 1px solid #cfdede; border-radius: 5px; padding: 5px 7px; font-size: 13px; }
  .foot { display: flex; gap: 5px; padding: 6px; border-top: 1px solid #eef3f3; }
  textarea { flex: 1; border: 0; outline: none; resize: none; padding: 14px; font: 14px/1.7 Consolas, monospace; color: #23323a; }
  #view iframe { flex: 1; border: 0; background: #fff; width: 100%; }
  #view { flex: 1; display: flex; min-height: 0; }
  .empty { color: #9ab; padding: 20px; text-align: center; }
  #dropHint { position: fixed; inset: 0; background: rgba(31,111,111,.12); border: 3px dashed #1f9f9f; display: none; align-items: center; justify-content: center; font: 700 18px sans-serif; color: #1f6f6f; pointer-events: none; z-index: 99; }
</style>
</head>
<body>
<div id="app">
  <div id="boxes">
    <div class="hd"><span class="grow" id="rootName">📒</span></div>
    <div class="list" id="boxList"></div>
    <div class="foot"><input class="new" id="newBox" placeholder="新しい箱" /><button id="addBox">＋</button></div>
    <div class="foot"><button id="chgRoot" style="flex:1">保存先を変更</button></div>
  </div>
  <div id="notes">
    <div class="hd"><span class="grow" id="boxName">—</span><button id="addNote">＋メモ</button></div>
    <div class="list" id="noteList"></div>
  </div>
  <div id="content">
    <div class="hd"><span class="grow" id="noteName">—</span></div>
    <div id="view"></div>
  </div>
</div>
<div id="dropHint">ここにドロップして取り込み</div>
<script src="scrap.js"></script>
</body>
</html>
